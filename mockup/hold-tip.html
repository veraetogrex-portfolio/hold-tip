<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T31 Hold to Tip — hold the key, let go at your tip</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the component from ../, dressed in Nocturne type; no grid on the app screen (DESIGN.md R-07: grid only in the reel header) */
  #stage{background:var(--room);--font:var(--f-text)}
  #stage .ht{position:absolute;left:40px;top:36px;zoom:1;z-index:1}
  .status-line{color:var(--text-3)}
  body.autoplay #stage :focus-visible{outline:none}
  body.autoplay #li-cursor{transition:none}   /* visible from frame one, no fade at the loop seam */
</style>
</head>
<body>
<div id="stage" data-title="T31 Hold to Tip" data-url="veraetogrex-portfolio.github.io/hold-tip">
  <section class="ht" id="tip" aria-label="Trip total and tip">
    <header class="ht-top">
      <p class="ht-brand"><b>VECTOR</b><span>Ride</span></p>
      <p class="ht-order">Trip ended 8:42 PM</p>
    </header>

    <!-- the order: who drove, where, what it cost -->
    <div class="ht-trip">
      <span class="ht-ava" aria-hidden="true">MI</span>
      <p class="ht-who"><b>Marta Ilves</b><span>Grey Corolla, 7KV 214</span></p>
      <p class="ht-route"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><path d="M6 8.5v3a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v.5"/><path d="M18 21.5s-3-2.7-3-4.6a3 3 0 0 1 6 0c0 1.9-3 4.6-3 4.6z"/></svg><b>Harbor St to Oak Ave</b><span>14 min, 6.2 mi</span></p>
    </div>

    <div class="ht-tip">
      <p class="ht-tip-h"><span>Tip for Marta</span><span class="ht-max">Up to $5</span></p>
      <div class="ht-row">
        <p class="ht-read" role="status" aria-label="Tip $0.00">$0.00</p>
        <dl class="ht-sum" aria-label="Your fare">
          <div><dt>Fare</dt><dd>$21.50</dd></div>
          <div><dt>Tip</dt><dd class="ht-tipline">None</dd></div>
          <div class="ht-total"><dt>Total</dt><dd class="ht-total-v" aria-live="polite">$21.50</dd></div>
        </dl>
      </div>

      <!-- one wide key; while it is held the amber fill grows, on release the filled part stays as the tip and the rest becomes Confirm -->
      <div class="ht-keys">
        <button class="ht-key" aria-describedby="ht-hint">
          <span class="ht-cap ht-cap--base"><span class="ht-side"></span><span class="ht-face"><span class="ht-ticks"></span><span class="ht-lbl"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg><span class="ht-lbl-t">Hold to add a tip</span></span></span></span>
          <span class="ht-cap ht-cap--ok" aria-hidden="true"><span class="ht-side"></span><span class="ht-face"></span></span>
          <span class="ht-cap ht-cap--fill" aria-hidden="true"><span class="ht-side"></span><span class="ht-face"><span class="ht-ticks"></span><span class="ht-lbl ht-lbl--fill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg><span class="ht-lbl-t">Hold to add a tip</span></span>
            <span class="ht-chip"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><b class="ht-chip-v">$0.00</b></span></span></span>
          <span class="ht-dent" aria-hidden="true"></span>
        </button>
        <button class="ht-confirm" tabindex="-1"><span class="ht-confirm-t">Confirm tip</span></button>
        <button class="ht-clear" tabindex="-1" aria-label="Clear tip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>

      <!-- the scale is also a set of buttons: one tap sets an exact amount -->
      <div class="ht-scale" role="group" aria-label="Set tip">
        <span>$0</span><button data-v="1">$1</button><button data-v="2">$2</button><button data-v="3">$3</button><button data-v="4">$4</button><button data-v="5">$5</button>
      </div>
      <p class="ht-hint" id="ht-hint">Let go at the amount you want</p>
    </div>
  </section>
  <div class="status-line"><span>Veraetogrex · T31</span><span>Ride · hold to tip</span></div>
</div>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const tip = document.querySelector('#tip').tip;
const pressAt = () => { const r = Stage.rect(tip.key); return [r.x + r.w * .3, r.y + 72]; };   // between the locked amount and the label, so the press covers neither
Stage.init({
  reset: () => tip.reset(),
  get cursorStart() { return pressAt(); },          // resting on the key in frame one
  async demo(s) {
    const t0 = performance.now(), home = pressAt();
    await s.wait(100);
    await s.down();                                   // press and hold: the key sinks, the fill grows, $0.00 counts up
    await s.until(t0, 1300);                          // 1.2 s at $2.50 a second
    while (tip.amount() < 2.875) await s.wait(16);    // a slow live page still lets go at $3.00 (the recorded reel never waits here)
    await s.up();                                     // let go at $3.00: the fill stays as the tip, the rest becomes Confirm
    await s.until(t0, 2100);
    const c = s.rect(tip.clear);
    await s.move([c.cx - 6, c.cy + 88], 520);         // off the tip so "$3.00" stays readable, next to its ×
    await s.until(t0, 3800);
    await s.click(tip.clear, { ms: 300, hold: 110 });   // × on the tip: the key closes up and drains to $0.00 in one motion
    await s.until(t0, 4950);
    await s.move(home, 480);                          // back to where frame one rests
    await s.until(t0, 5700);
  },
});
</script>
</body>
</html>
